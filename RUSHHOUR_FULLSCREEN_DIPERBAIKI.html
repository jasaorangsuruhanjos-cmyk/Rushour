const names=["Pindahan & Angkut Barang", "Bongkar Muat / TKBM", "Cleaning Service", "Potong Rumput", "Pertukangan", "Cuci Toren", "Kusen, Jendela & Aluminium", "Jasa Umum / Lainnya", "Pijat Relaksasi"];const admin='6288289419927';const shade=document.getElementById('shade'),form=document.getElementById('form'),service=document.getElementById('service'),nav=document.getElementById('nav');names.forEach((name,i)=>service.add(new Option(name,String(i))));function openBooking(i){nav.hidden=true;form.hidden=false;service.value=String(i);document.getElementById('title').textContent='Booking '+names[i];extraFields();shade.classList.add('open')}function extraFields(){let i=Number(service.value),el=document.getElementById('extra');el.replaceChildren();let configs={0:['Alamat tujuan','Jenis barang'],1:['Jumlah pekerja','Durasi (jam)'],2:['Luas area / jumlah ruangan'],3:['Luas lahan (m²)'],4:['Jenis perbaikan'],5:['Jumlah toren'],6:['Ukuran / jumlah unit'],7:['Jenis pekerjaan'],8:['Durasi pijat (menit)']};(configs[i]||[]).forEach(label=>{let l=document.createElement('label');l.textContent=label;let inp=document.createElement('input');inp.dataset.extra=label;inp.placeholder=label;el.append(l,inp)})}service.onchange=()=>{document.getElementById('title').textContent='Booking '+names[service.value];extraFields()};function money(v){return 'Rp '+v.toLocaleString('id-ID')}document.getElementById('price').oninput=()=>{let v=document.getElementById('price').value,has=v!=='';let n=Number(v),fee=Math.round(n*.2);document.getElementById('base').textContent=has?money(n):'Konfirmasi admin';document.getElementById('fee').textContent=has?money(fee):'Konfirmasi admin';document.getElementById('total').textContent=has?money(n+fee):'Konfirmasi admin'};function whatsapp(message){location.href='https://wa.me/'+admin+'?text='+encodeURIComponent(message)}function contactAdmin(){whatsapp('Halo Admin RUSHHOUR, saya ingin bertanya tentang layanan.')}function openMenu(){form.hidden=true;nav.hidden=false;document.getElementById('title').textContent='Pilih Layanan';nav.replaceChildren();names.forEach((name,i)=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>openBooking(i);nav.append(b)});shade.classList.add('open')}document.getElementById('close').onclick=()=>shade.classList.remove('open');shade.addEventListener('click',e=>{if(e.target===shade)shade.classList.remove('open')});form.addEventListener('submit',e=>{e.preventDefault();const get=id=>document.getElementById(id).value.trim();let p=get('price'),has=p!=='';let n=Number(p),fee=Math.round(n*.2);let lines=['*BOOKING RUSHHOUR*','Layanan: '+names[service.value],'Nama: '+get('name'),'WhatsApp: '+get('phone'),'Alamat: '+get('address'),'Detail: '+get('detail'),'Tanggal: '+(get('date')||'Belum ditentukan')];document.querySelectorAll('[data-extra]').forEach(x=>{if(x.value)lines.push(x.dataset.extra+': '+x.value)});lines.push('Harga layanan: '+(has?money(n):'Konfirmasi admin'),'Biaya admin (20%): '+(has?money(fee):'Konfirmasi admin'),'Total estimasi: '+(has?money(n+fee):'Konfirmasi admin'));if(document.getElementById('files').files.length)lines.push('Lampiran akan dikirim terpisah');whatsapp(lines.join('\n'))});</script></body></html>
