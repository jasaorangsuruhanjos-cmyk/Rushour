{name:'Bongkar Muat / TKBM',desc:'Tenaga kerja bongkar muat',icon:'📦',packages:[['Bongkar muat ringan',150000],['Bongkar muat sedang',200000],['Bongkar muat berat',250000]]},
{name:'Cleaning Service',desc:'Rumah, kos, kantor',icon:'🧹',packages:[['Pembersihan standar',150000],['Pembersihan menyeluruh',200000],['Pembersihan besar',250000]]},
{name:'Potong Rumput',desc:'Pilih ukuran area',icon:'🌱',packages:[['Area kecil',100000],['Area sedang',150000],['Area besar',200000]]},
{name:'Pertukangan',desc:'Perbaikan & pengerjaan',icon:'🛠️',packages:[['Pekerjaan ringan',150000],['Pekerjaan sedang',250000],['Pekerjaan berat',350000]]},
{name:'Cuci Toren',desc:'Pilih jumlah toren',icon:'💧',packages:[['1 toren',100000],['2 toren',180000],['3 toren',250000]]},
{name:'Kusen, Jendela & Aluminium',desc:'Kusen, pintu, jendela, kitchen set',icon:'🪟',packages:[['Perbaikan ringan',150000],['Pemasangan kusen/pintu',250000],['Kitchen set / pekerjaan khusus',350000]]},
{name:'Jasa Umum / Lainnya',desc:'Kebutuhan lainnya',icon:'🔧',packages:[['Pekerjaan ringan',100000],['Pekerjaan sedang',150000],['Pekerjaan khusus',200000],['Harga kesepakatan admin',0]],customLast:true},
{name:'Pijat Relaksasi',desc:'60 / 90 / 120 menit',icon:'💆',packages:[['60 menit',125000],['90 menit',175000],['120 menit',225000]],single:true}
];
const ADMIN='6288289419927';const $=id=>document.getElementById(id);const rupiah=n=>'Rp '+Math.round(n).toLocaleString('id-ID');let active=0;
function calculate(){let s=services[active],idx=Number($('package').value)||0,p=s.packages[idx],custom=s.customLast&&idx===s.packages.length-1; $('customWrap').classList.toggle('hide',!custom);$('workers').disabled=!!s.single;if(s.single)$('workers').value=1;let count=s.single?1:Math.max(1,Number($('workers').value)||1),labor=(custom?Number($('custom').value)||0:p[1])*count,car=p[2]?350000:0,fee=Math.round(labor*.2),total=labor+car+fee; $('labor').textContent=rupiah(labor);$('car').textContent=rupiah(car);$('fee').textContent=rupiah(fee);$('total').textContent=rupiah(total);return {p,count,labor,car,fee,total,custom};}
function choose(i){active=i;$('service').value=i;$('heading').textContent='Booking '+services[i].name;$('package').innerHTML='';services[i].packages.forEach((p,j)=>{let o=document.createElement('option');o.value=j;o.textContent=p[0]+' — '+(p[1]?rupiah(p[1]):'Kesepakatan admin')+(p[2]?' + mobil Rp350.000':'');$('package').appendChild(o)});calculate()}
function show(i){$('menuList').classList.add('hide');$('form').classList.remove('hide');$('hint').textContent='Isi formulir dan lihat estimasi harga sebelum mengirim.';choose(i);$('overlay').classList.add('open')}
function showMenu(){$('form').classList.add('hide');$('menuList').classList.remove('hide');$('heading').textContent='Semua Layanan RUSHHOUR';$('hint').textContent='Pilih layanan untuk memulai booking.';$('overlay').classList.add('open')}
services.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=s.name;$('service').appendChild(o);let b=document.createElement('button');b.className='service-choice';b.type='button';b.textContent=s.name;b.onclick=()=>show(i);$('menuList').appendChild(b)});
document.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.index))));$('menuButton').onclick=showMenu;$('contactButton').onclick=()=>{location.href='https://wa.me/'+ADMIN+'?text='+encodeURIComponent('Halo Admin RUSHHOUR, saya ingin bertanya tentang layanan.')};$('close').onclick=()=>{$('overlay').classList.remove('open')};$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};$('service').onchange=e=>choose(Number(e.target.value));['package','workers','custom'].forEach(id=>$(id).addEventListener('input',calculate));$('files').onchange=e=>{$('fileInfo').textContent=Array.from(e.target.files).map(f=>f.name).join(', ')+' — kirim manual di WhatsApp setelah chat terbuka.'};$('date').min=new Date().toLocaleDateString('en-CA');$('form').onsubmit=e=>{e.preventDefault();let x=calculate();if(x.custom&&!x.labor){alert('Masukkan harga kesepakatan.');return}let v=id=>$(id).value.trim(),msg=['Halo Admin RUSHHOUR, saya ingin booking.','','Layanan: '+services[active].name,'Paket: '+x.p[0],'Jumlah pekerja: '+x.count,'Tanggal: '+v('date'),'Jam: '+v('time'),'Nama: '+v('name'),'WhatsApp: '+v('phone'),'Alamat: '+v('address'),'Detail: '+v('detail'),'Biaya layanan: '+rupiah(x.labor),'Biaya mobil: '+rupiah(x.car),'Admin 20%: '+rupiah(x.fee),'Total estimasi: '+rupiah(x.total),'Lampiran: '+($('files').files.length?$('files').files.length+' file akan dikirim terpisah':'Tidak ada')].join('\n');location.href='https://wa.me/'+ADMIN+'?text='+encodeURIComponent(msg)};
</script></body></html>
